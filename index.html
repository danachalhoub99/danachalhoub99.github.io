<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dana Chalhoub – Business Systems Developer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;500;700&display=swap">
<style id="css">
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{--bg:#F5F4FF;--surface:#fff;--ink:#16112F;--muted:#5C5878;--line:#E1DDF4;--accent:#5B3FE0;--accent2:#0E7490;--accent-ink:#fff;--chip:#EDE9FF;--bar:#F1EFFC;--hbg:rgba(245,244,255,.82);--dlg:#fff;--b1:#C9BDFF;--b2:#A5E8F5;--b3:#FFD6E8;--bo:.6;--sh:0 10px 30px rgba(60,40,140,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0E1F;--surface:rgba(255,255,255,.05);--ink:#EEF1FF;--muted:#A3AECF;--line:rgba(255,255,255,.12);--accent:#9B86FF;--accent2:#22D3EE;--accent-ink:#0A0E1F;--chip:rgba(155,134,255,.18);--bar:rgba(255,255,255,.05);--hbg:rgba(10,14,31,.8);--dlg:#141A38;--b1:#4B2FD0;--b2:#0A7F96;--b3:#8A1F6A;--bo:.5;--sh:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A0E1F;--surface:rgba(255,255,255,.05);--ink:#EEF1FF;--muted:#A3AECF;--line:rgba(255,255,255,.12);--accent:#9B86FF;--accent2:#22D3EE;--accent-ink:#0A0E1F;--chip:rgba(155,134,255,.18);--bar:rgba(255,255,255,.05);--hbg:rgba(10,14,31,.8);--dlg:#141A38;--b1:#4B2FD0;--b2:#0A7F96;--b3:#8A1F6A;--bo:.5;--sh:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.65 Manrope,system-ui,"Segoe UI",Arial,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:12}
h1,h2,h3{font-family:"Space Grotesk",Manrope,system-ui,sans-serif;line-height:1.15;margin:0}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:var(--bo)}
.aurora i:nth-child(1){width:46vw;height:46vw;left:-10vw;top:-12vw;background:var(--b1);animation:d1 22s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:40vw;height:40vw;right:-12vw;top:18vh;background:var(--b2);animation:d2 26s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:34vw;height:34vw;left:30vw;bottom:-14vw;background:var(--b3);animation:d3 30s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(12vw,10vh) scale(1.2)}}
@keyframes d2{to{transform:translate(-10vw,12vh) scale(.85)}}
@keyframes d3{to{transform:translate(-14vw,-10vh) scale(1.25)}}
.prog{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:3px;z-index:14;transform-origin:left;transform:scaleX(var(--p,0));background:linear-gradient(90deg,var(--accent),var(--accent2))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:13;background:var(--hbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
header.sc{border-bottom-color:var(--line)}
header .wrap{display:flex;align-items:center;gap:20px;min-height:64px}
.logo{font:700 1.1rem "Space Grotesk",sans-serif;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:10px;margin-right:auto}
.logo i{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--chip)}100%{box-shadow:0 0 0 12px transparent}}
nav{display:flex;gap:6px}
nav a{position:relative;color:var(--muted);text-decoration:none;font-weight:600;font-size:.95rem;padding:8px 12px;border-radius:8px;transition:color .2s}
nav a::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:2px;border-radius:2px;background:var(--accent);transform:scaleX(0);transition:transform .3s}
nav a:hover,nav a.on{color:var(--ink)}
nav a:hover::after,nav a.on::after{transform:scaleX(1)}
.theme{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.1rem;cursor:pointer;transition:transform .4s}
.theme:hover{transform:rotate(180deg)}
.hero{padding:88px 0 72px}
.hero .wrap{display:grid;grid-template-columns:1fr 280px;gap:56px;align-items:center}
.hero h1{font-size:clamp(2.4rem,6vw,4.1rem);font-weight:700;letter-spacing:-.03em;background:linear-gradient(100deg,var(--ink) 30%,var(--accent) 55%,var(--accent2) 75%,var(--ink));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s ease-in-out infinite alternate}
@keyframes shine{to{background-position:100% 0}}
.role{font:500 1.35rem "Space Grotesk",sans-serif;color:var(--accent);margin:16px 0 18px;min-height:1.7em}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--accent);margin-left:3px;vertical-align:-.15em;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.intro{max-width:58ch;color:var(--muted);margin:0 0 30px}
.ph{position:relative;width:280px;height:280px;border-radius:36px;padding:4px;animation:float 7s ease-in-out infinite}
.ph::before{content:"";position:absolute;inset:-3px;border-radius:39px;background:conic-gradient(from var(--a),var(--accent),var(--accent2),#FF7AC3,var(--accent));animation:spin 6s linear infinite}
@keyframes spin{to{--a:360deg}}
@keyframes float{50%{transform:translateY(-10px)}}
.photo{position:relative;display:block;width:100%;height:100%;border-radius:32px;object-fit:cover;background:var(--chip);border:4px solid var(--bg)}
.btns,.links{display:flex;gap:12px;flex-wrap:wrap}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;padding:12px 22px;border-radius:12px;font:700 1rem Manrope,sans-serif;text-decoration:none;border:2px solid transparent;cursor:pointer;transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(91,63,224,.28)}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink)}
.btn.pri::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);transition:left .6s}
.btn.pri:hover::after{left:130%}
.btn.sec{border-color:var(--accent);color:var(--accent);background:transparent}
section{padding:80px 0}
.sh{margin-bottom:36px}
.num{font:700 .9rem "Space Grotesk",sans-serif;color:var(--accent);letter-spacing:.12em}
.sh h2{font-size:clamp(1.8rem,4vw,2.5rem);letter-spacing:-.02em;margin-top:4px}
.ul{display:block;height:4px;width:0;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));margin:12px 0 14px;transition:width .9s .25s ease}
.sh.in .ul{width:72px}
.lead{color:var(--muted);margin:0;max-width:62ch}
.rv{opacity:0;translate:0 28px;transition:opacity .8s ease var(--d,0s),translate .8s cubic-bezier(.2,.7,.2,1) var(--d,0s)}
.rv.in{opacity:1;translate:0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.card,.sk,.acad,.fcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card.rv,.sk.rv{transition:opacity .8s ease var(--d,0s),translate .8s cubic-bezier(.2,.7,.2,1) var(--d,0s),transform .35s,border-color .35s}
.card,.sk{overflow:hidden}
.card{display:flex;flex-direction:column}
.card::after,.sk::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(340px circle at var(--mx,50%) var(--my,0),var(--chip),transparent 65%)}
.card:hover,.sk:hover{transform:translateY(-6px);border-color:var(--accent)}
.card:hover::after,.sk:hover::after{opacity:1}
.bar{display:flex;align-items:center;gap:7px;padding:11px 16px;background:var(--bar);border-bottom:1px solid var(--line);font:600 .82rem Manrope,sans-serif;color:var(--muted)}
.bar i{width:10px;height:10px;border-radius:50%;display:inline-block}
.bar i:nth-child(1){background:#FF5F57}.bar i:nth-child(2){background:#FEBC2E}.bar i:nth-child(3){background:#28C840}
.bar span{margin-left:8px}
.body{padding:22px;display:flex;flex-direction:column;gap:12px;flex:1;position:relative;z-index:1}
.card h3{font-size:1.2rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.chips li{background:var(--chip);color:var(--ink);font-size:.82rem;font-weight:600;padding:3px 11px;border-radius:999px;opacity:0}
.rv.in .chips li{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--d,0s) + .25s + var(--i,0) * .06s)}
@keyframes pop{from{opacity:0;scale:.7}to{opacity:1;scale:1}}
ul.pts{margin:0;padding-left:1.1rem;color:var(--muted);font-size:.98rem}
ul.pts li{margin-bottom:6px}
.stack{margin-top:auto;font-size:.88rem;color:var(--muted);font-weight:600}
.acad{margin-top:32px;padding:22px 24px}
.acad h3{font-size:1.05rem;margin-bottom:10px}
.acad ul,.two ul{margin:0;padding-left:1.1rem;color:var(--muted)}
.tl{position:relative;list-style:none;margin:0;padding:0 0 0 30px}
.tl::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--accent),var(--accent2));transform-origin:top;transform:scaleY(0);transition:transform 1.6s ease}
.tl.in::before{transform:scaleY(1)}
.tl>li{position:relative;margin-bottom:34px}
.tl>li::before{content:"";position:absolute;left:-37px;top:7px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);animation:pulse 2.6s ease-out infinite}
.tl h3{font-size:1.15rem}
.tl .meta{color:var(--muted);font-size:.92rem;margin:2px 0 8px}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.sk{padding:20px 22px}
.sk>*{position:relative;z-index:1}
.skills h3,.two h3{font-size:1.05rem;margin-bottom:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.two li{margin-bottom:8px}
.two b{color:var(--ink)}
.cgrid{display:grid;grid-template-columns:1fr 1.2fr;gap:40px;align-items:start}
.big{display:block;font:700 clamp(1.1rem,3vw,1.5rem) "Space Grotesk",sans-serif;word-break:break-all;margin-bottom:8px}
.links{margin-top:20px}
.fcard{padding:28px}
.f{margin-bottom:16px}
.f label{display:block;font-weight:700;font-size:.88rem;color:var(--muted);margin-bottom:6px}
.f input,.f textarea{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);transition:border-color .2s,box-shadow .2s}
.f input:focus,.f textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--chip)}
.f textarea{min-height:130px;resize:vertical}
.err{color:#D93B5A;font-weight:600;margin:0 0 12px;min-height:1.2em}
.note{margin:12px 0 0;color:var(--muted);font-size:.95rem}
footer{padding:28px 0 44px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tools{display:flex;gap:8px;margin-top:8px}
.tools button,.add,.dlg button{font:600 .85rem Manrope,sans-serif;padding:6px 12px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.add{margin-top:16px;background:var(--chip)}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:10px;align-items:center}
#fab button{font:700 .95rem Manrope,sans-serif;padding:11px 18px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#st{background:var(--surface);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:.88rem}
.dlg{max-height:90vh;overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);width:min(520px,92vw);padding:22px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:grid;place-items:center;padding:16px}
.dlg label{display:block;font-weight:700;font-size:.9rem;margin:14px 0 4px}
.dlg input,.dlg textarea{width:100%;font:inherit;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.dlg textarea{min-height:110px;resize:vertical}
.dlg .row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.dlg .row .go{background:var(--accent);color:var(--accent-ink)}
.tools.own{flex-wrap:wrap;margin-top:14px}
#fab button{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.dlg{background:var(--dlg)}
@media (max-width:760px){.hero{padding:44px 0}.hero .wrap{grid-template-columns:1fr;gap:32px}.ph{order:-1;width:170px;height:170px;border-radius:28px}.photo{border-radius:24px}.ph::before{border-radius:31px}header .wrap{flex-wrap:wrap;gap:8px 12px;padding-bottom:6px}nav{order:3;width:100%;overflow-x:auto}.cgrid{grid-template-columns:1fr}section{padding:56px 0}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;translate:0 0}.chips li{opacity:1}.tl::before{transform:none}.sh .ul{width:72px}}
</style>
</head>

function typer(){clearTimeout(tw);var el=$("#tw");if(!el||RM)return;var W=[S.profile.role,"Solution consulting","Web development"],w=0,c=W[0].length,del=true;

var busy=false;

var h='<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div><div class="prog" aria-hidden="true"></div><header><div class="wrap"><a class="logo" href="#top"><i></i>'+esc(p.name)+'</a><nav aria-label="Main"><a href="#projects">Projects</a><a href="#experience">Experience</a><a href="#skills">Skills</a><a href="#education">Education</a><a href="#contact">Contact</a></nav><button class="theme" data-a="theme" aria-label="Switch between light and dark theme" title="Switch theme">◐</button></div></header><main id="top">';
var own=canEdit?'<div class="tools own"><button data-a="cv">'+(cv?"Replace CV (PDF)":"Upload CV (PDF)")+'</button>'+(cv?'<button data-a="cvrm">Remove CV</button>':"")+(E()?'<button data-a="edit" data-k="profile" data-i="-1">Edit profile</button>':"")+'<input id="cvin" type="file" accept="application/pdf,.pdf" hidden></div>':"";

h+='<section id="projects"><div class="wrap">'+sh(1,"Projects","Systems I designed and built, each with its own modules, dashboard, and data rules.")+'<div class="grid">';
S.projects.forEach(function(x,i){h+='<article '+R("card",i*.12)+'><div class="bar"><i></i><i></i><i></i><span>'+esc(x.title)+'</span></div><div class="body"><h3>'+esc(x.sub)+'</h3><ul class="chips">'+lis(x.chips,1)+'</ul><ul class="pts">'+lis(x.pts)+'</ul><p class="stack">'+esc(x.stack)+'</p>'+t("projects",i)+'</div></article>'});
h+='</div>'+ad("projects")+'<div '+R("acad")+'><h3>Academic projects at Lebanese University</h3><ul>';
S.acad.forEach(function(x,i){h+="<li>"+esc(x.text)+t("acad",i)+"</li>"});
h+='</ul>'+ad("acad")+'</div></div></section>';
h+='<section id="experience"><div class="wrap">'+sh(2,"Experience","Where I learned what makes a system usable.")+'<ol '+R("tl")+'>';
S.exp.forEach(function(x,i){h+='<li '+R("",i*.1)+'><h3>'+esc(x.title)+'</h3><p class="meta">'+esc(x.meta)+'</p><ul class="pts">'+lis(x.pts)+'</ul>'+t("exp",i)+'</li>'});

h+='<section id="skills"><div class="wrap">'+sh(3,"Skills","The tools I use to build, and the working skills I bring to a team.")+'<div class="skills">';

h+='</div>'+ad("skills")+'</div></section>';
h+='<section id="education"><div class="wrap">'+sh(4,"Education and training")+'<div class="two"><div '+R("sk")+'><h3>Degrees</h3><ul>';
S.degrees.forEach(function(x,i){h+="<li><b>"+esc(x.title)+"</b><br>"+esc(x.meta)+t("degrees",i)+"</li>"});
h+='</ul>'+ad("degrees")+'</div><div '+R("sk",.1)+'><h3>Certifications</h3><ul>';
S.certs.forEach(function(x,i){h+="<li>"+esc(x.text)+t("certs",i)+"</li>"});
h+='</ul>'+ad("certs")+'</div><div '+R("sk",.2)+'><h3>Languages</h3><ul>';
S.langs.forEach(function(x,i){h+="<li>"+esc(x.text)+t("langs",i)+"</li>"});
h+='</ul>'+ad("langs")+'</div></div></div></section>';
h+='<section id="contact"><div class="wrap">'+sh(5,"Contact","I’m open to roles in business systems, solution consulting, and web development. Send me a message.")+'<div class="cgrid"><div '+R("",.1)+'><a class="big" href="mailto:'+esc(p.email)+'">'+esc(p.email)+'</a><div class="links">'+(p.github?'<a class="btn pri" href="'+esc(p.github)+'">GitHub</a>':"")+(p.linkedin?'<a class="btn sec" href="'+esc(p.linkedin)+'">LinkedIn</a>':"")+(p.phone?'<a class="btn sec" href="tel:'+esc(p.phone.replace(/\s/g,""))+'">'+esc(p.phone)+'</a>':"")+(cv?'<a class="btn sec" href="'+esc(cv)+'" target="_blank" rel="noopener">View CV (PDF)</a>':"")+'</div></div>';
h+='<form id="cf" novalidate '+R("fcard",.2)+'><div class="f"><label for="cn">Your name</label><input id="cn" autocomplete="name" required></div><div class="f"><label for="ce">Your email</label><input id="ce" type="email" autocomplete="email" required></div><div class="f"><label for="cs">Subject (optional)</label><input id="cs"></div><div class="f"><label for="cm">Message</label><textarea id="cm" required></textarea></div><p class="err" id="cerr" role="alert"></p><button class="btn pri" type="submit">Send message</button><p class="note" id="cnote" role="status"></p></form></div></div></section></main><footer><div class="wrap"><span>'+esc(p.name)+', Lebanon</span><a href="#top">Back to top ↑</a></div></footer>';
if(canEdit)h+='<div id="fab"><span id="st" hidden></span><button data-a="toggle">'+(editing?"Done editing":"Edit portfolio")+'</button></div>';
$("#app").innerHTML=h;observe();typer();onScroll()}
function st(m){var e=$("#st");if(e){e.hidden=!m;e.textContent=m||""}}
function build(){return "<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"><title>"+esc(S.profile.name+" – "+S.profile.role)+"</title><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;500;700&display=swap\"><style id=\"css\">"+$("#css").textContent+"</style></head><body><div id=\"app\"></div><script type=\"application/json\" id=\"data\">"+JSON.stringify(S).replace(/</g,"\\u003c")+"<\/script><script id=\"js\">"+$("#js").textContent+"<\/script></body></html>"}
function commit(){st("Saving…");try{sessionStorage.setItem("edit","1")}catch(e){}
return api.publish(build()).catch(function(e){var c=e&&e.code;if(c==="conflict")return;if(c==="not_writer"||c==="not_granted"||c==="capability_disabled"){canEdit=false;editing=false;render();return}
st(c==="rate_limited"?"Too many saves. Wait a moment.":"Could not save. Try again.")})}
function split(v,k){return k==="chips"?v.split(",").map(function(s){return s.trim()}).filter(Boolean):v.split("\n").map(function(s){return s.trim()}).filter(Boolean)}
function open(k,i){var sc=SCH[k],o=k==="profile"?S.profile:(i>=0?S[k][i]:{}),d=document.createElement("div"),h="<div class=\"dlg\" role=\"dialog\" aria-modal=\"true\"><h3>"+(i>=0||k==="profile"?"Edit ":"Add ")+sc.n+"</h3>";
sc.f.forEach(function(f,j){var v=o[f[0]]==null?"":o[f[0]];if(Array.isArray(v))v=f[0]==="chips"?v.join(", "):v.join("\n");
var big=f[0]==="pts"||f[0]==="intro";h+='<label for="f'+j+'">'+f[1]+'</label>'+(big?'<textarea id="f'+j+'">'+esc(v)+'</textarea>':'<input id="f'+j+'" value="'+esc(v)+'">')});
h+='<div class="row"><button data-x="c">Cancel</button><button class="go" data-x="s">Save</button></div>';d.className="ov";d.innerHTML=h+"</div>";document.body.appendChild(d);
d.addEventListener("click",function(e){var x=e.target.getAttribute&&e.target.getAttribute("data-x");if(e.target===d){d.remove();return}if(!x)return;
if(x==="c"){d.remove();return}
var n={};sc.f.forEach(function(f,j){var v=d.querySelector("#f"+j).value;n[f[0]]=(f[0]==="chips"||f[0]==="pts")?split(v,f[0]):v.trim()});
if(!sc.f.some(function(f,j){return n[f[0]].length}))return;
if(k==="profile"){S.profile=Object.assign({},S.profile,n)}else if(i>=0){S[k][i]=n}else{S[k].push(n)}
d.remove();render();commit()})}
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-a]");if(!b)return;var a=b.getAttribute("data-a"),k=b.getAttribute("data-k"),i=parseInt(b.getAttribute("data-i"),10);
if(a==="theme"){var rt=document.documentElement,cu=rt.getAttribute("data-theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light");rt.setAttribute("data-theme",cu==="dark"?"light":"dark")}
else if(a==="cv"){var fi=$("#cvin");if(fi)fi.click()}
else if(a==="cvrm"){if(b.getAttribute("data-s")!=="1"){b.setAttribute("data-s","1");b.textContent="Click again to remove";return}var id=S.profile.cvId;S.profile.cv="";S.profile.cvId="";
Promise.resolve(window.claude&&id&&claude.use("assets")).then(function(as){return as&&as.delete(id)}).catch(function(){}).then(function(){render();commit()})}
else if(a==="toggle"){editing=!editing;try{sessionStorage.setItem("edit",editing?"1":"0")}catch(x){}render()}
else if(a==="add")open(k,-1);
else if(a==="edit")open(k,i);
else if(a==="del"){if(b.getAttribute("data-s")!=="1"){b.setAttribute("data-s","1");b.textContent="Click again to remove";return}S[k].splice(i,1);render();commit()}});
addEventListener("scroll",onScroll,{passive:true});
document.addEventListener("pointermove",function(e){var c=e.target.closest&&e.target.closest(".card,.sk");if(!c)return;var r=c.getBoundingClientRect();c.style.setProperty("--mx",(e.clientX-r.left)+"px");c.style.setProperty("--my",(e.clientY-r.top)+"px")});
document.addEventListener("change",function(e){if(e.target.id!=="cvin")return;var f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
if(f.type!=="application/pdf"&&!/\.pdf$/i.test(f.name)){st("Please choose a PDF file.");return}
if(f.size>20*1024*1024){st("That PDF is over 20 MB.");return}
st("Uploading…");
Promise.resolve(window.claude&&claude.use("assets")).then(function(as){if(!as){st("Uploads are not available here.");return}
return as.upload(f).then(function(r){S.profile.cv=r.url;S.profile.cvId=r.id;render();commit()})}).catch(function(){st("Upload failed. Try again.")})});
document.addEventListener("submit",function(e){if(e.target.id!=="cf")return;e.preventDefault();
var n=$("#cn").value.trim(),m=$("#ce").value.trim(),sj=$("#cs").value.trim(),b=$("#cm").value.trim(),er=$("#cerr"),nt=$("#cnote"),p=S.profile;er.textContent="";nt.textContent="";

mail()});
